services:
  postgres:
    image: postgres:17
    container_name: ultrashop-postgres

    environment:
      POSTGRES_DB: UltraShopDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Derfgtyhju

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: